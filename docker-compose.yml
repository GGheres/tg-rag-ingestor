services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tgrag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tgrag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: golang:1.25
    working_dir: /app/backend
    env_file:
      - .env
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/tgrag?sslmode=disable
      REDIS_ADDR: redis:6379
      QDRANT_URL: http://qdrant:6333
      APP_PORT: "8080"
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      GOPROXY: "off"
      GOSUMDB: "off"
    command: sh -lc "/usr/local/go/bin/go run ./cmd/api"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - ${HOME}/go/pkg/mod:/go/pkg/mod
      - ${HOME}/Library/Caches/go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  frontend_node_modules:
